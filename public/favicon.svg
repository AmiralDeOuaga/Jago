<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2463"/>
      <stop offset="100%" stop-color="#1756C8"/>
    </linearGradient>
    <radialGradient id="halo" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,217,61,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,217,61,0)"/>
    </radialGradient>
  </defs>

  <!-- Fond bleu arrondi -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Halo doré en haut à droite -->
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>

  <!-- Cauri — corps ellipse blanc -->
  <ellipse cx="32" cy="33" rx="11" ry="15" fill="white"/>

  <!-- Cauri — slit central -->
  <line x1="32" y1="19" x2="32" y2="47" stroke="rgba(10,36,99,0.3)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cauri — dents horizontales -->
  <line x1="28" y1="24" x2="36" y2="24" stroke="rgba(10,36,99,0.3)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="28" y1="29" x2="36" y2="29" stroke="rgba(10,36,99,0.3)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="28" y1="34" x2="36" y2="34" stroke="rgba(10,36,99,0.3)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="28" y1="39" x2="36" y2="39" stroke="rgba(10,36,99,0.3)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="36" y2="44" stroke="rgba(10,36,99,0.3)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Reflet 3D -->
  <ellipse cx="27" cy="26" rx="2.5" ry="5" fill="rgba(255,255,255,0.4)"/>

  <!-- Point or en haut à droite -->
  <circle cx="51" cy="13" r="5" fill="#FFD93D"/>
  <circle cx="51" cy="13" r="7" fill="rgba(255,217,61,0.25)"/>
</svg>
